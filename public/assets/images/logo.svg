<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="otBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1924"/>
      <stop offset="100%" stop-color="#163248"/>
    </linearGradient>
    <linearGradient id="otPeakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="otSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge: Deep Dark-Alpine Blue so it stands out sharp on both Day and Night modes -->
  <circle cx="50" cy="50" r="48" fill="url(#otBgGrad)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.9"/>
  <!-- Mountain peaks -->
  <path d="M24 62 L44 36 L56 48 L66 34 L80 62" fill="none" stroke="url(#otPeakGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sun/Compass gold dot -->
  <circle cx="62" cy="26" r="4.5" fill="url(#otSunGrad)"/>
  <!-- Water/Trail curves -->
  <path d="M22 68 Q36 64 50 68 T78 68" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M26 76 Q40 72 50 76 T74 76" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
</svg>
